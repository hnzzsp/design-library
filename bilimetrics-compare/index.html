<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiliMetrics · UP 主多维度数据对比</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a href="../bilimetrics/index.html" style="display:inline-block;margin:14px 20px 0;padding:8px 16px;border-radius:10px;background:#161B22;border:1px solid rgba(240,246,252,.1);color:#C9D1D9;font-size:13px;font-family:'Noto Sans SC',sans-serif;">← BiliMetrics 首页</a>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 28 28" fill="none">
        <rect x="3" y="7" width="22" height="15" rx="3" stroke="#FB7299" stroke-width="2"/>
        <path d="M10 11l6 3-6 3V11z" fill="#FB7299"/>
        <path d="M7 4l3 3M21 4l-3 3" stroke="#FB7299" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="titles">
        <h1>BiliMetrics 哔哩大数据</h1>
        <p>UP 主多维度数据对比 · 效果预览</p>
      </div>
    </div>
    <div class="live-chip">
      <span class="live-dot"></span>
      <span id="liveText">示例数据 · 实时预览</span>
    </div>
  </header>

  <!-- 控制条：UP 选择 + 指标选择 -->
  <section class="controls">
    <div class="ctrl-block">
      <label class="heading">选择对比的 UP 主（本人已锁定）</label>
      <div class="up-selector" id="upSelector"></div>
    </div>
    <div class="ctrl-block">
      <label class="heading">图表指标</label>
      <div class="select-row">
        <select id="barMetric" aria-label="柱状图指标"></select>
        <select id="lineMetric" aria-label="折线图指标"></select>
      </div>
    </div>
  </section>

  <!-- 对比摘要 -->
  <div class="summary" id="summary"></div>

  <!-- 图表区 -->
  <section class="grid">
    <div class="card">
      <div class="card-head">
        <h2>多维能力雷达图</h2>
        <span class="tag">8 项指标归一化</span>
      </div>
      <div id="radar"></div>
      <div class="legend" id="radarLegend"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>单指标对比 · 柱状图</h2>
        <span class="tag" id="barTag">播放量</span>
      </div>
      <div id="bar"></div>
      <div class="legend" id="barLegend"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>30 天趋势 · 折线图</h2>
        <span class="tag" id="lineTag">粉丝数(万)</span>
      </div>
      <div id="line"></div>
      <div class="legend" id="lineLegend"></div>
    </div>
  </section>

  <!-- 数据明细表 -->
  <section class="card table-card">
    <div class="card-head">
      <h2>对比数据明细</h2>
      <span class="tag">单位：万</span>
    </div>
    <div class="table-wrap">
      <table id="dataTable"></table>
    </div>
  </section>

  <p class="note">
    说明：本页为「效果预览」原型，内置示例数据。接入真实 B 站数据只需替换
    <code>data.js</code> 中的 <code>UPS</code> 数组（字段与单位见文件顶部注释），无需改动图表与交互逻辑。
    雷达图用于多维度能力轮廓对比，柱状图用于单项指标横评，折线图用于 30 天走势对比。
  </p>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
